include themes/noctalia.conf

shell_integration enabled no-title

# Keybindings
map alt+shift+1  goto_tab 1
map alt+shift+2  goto_tab 2
map alt+shift+3  goto_tab 3
map alt+shift+4  goto_tab 4
map alt+shift+5  goto_tab 5
map alt+shift+6  goto_tab 6
map alt+shift+7  goto_tab 7
map alt+shift+8  goto_tab 8
map alt+shift+9  goto_tab 9
map alt+shift+0  goto_tab 10

# Mouse related
detect_urls yes
focus_follows_mouse yes

paste_actions quote-urls-at-prompt,confirm,confirm-if-large

# Font
font_family      family='Source Code Pro' postscript_name=SourceCodePro-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

# Appearance
background_opacity 0.6
background_blur 1
background #2e333a
foreground #FCFEFD
undercurl_style thick-sparse

tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}{sup.index}"

scrollbar scrolled-or-hovered
scrollbar_width 1
scrollbar_hover_width 1.5

color0  #252525   # black
color8  #505050   # bright black
color1  #D4A7E2   # red
color9  #F99286   # bright red
color2  #8DD78D   # green
color10 #C3F786   # bright green
color3  #EBEABD   # yellow
color11 #FCFBCC   # bright yellow
color4  #81A2BE   # blue
color12 #B6DEFB   # bright blue
color5  #D57FD2   # magenta
color13 #AD7FA8   # bright magenta
color6  #C8C9EB   # cyan
color14 #D7D9FC   # bright cyan
color7  #FCFEFD   # white
# color7  #E2E2E2   # white
color15 #E2E2E2   # bright white

